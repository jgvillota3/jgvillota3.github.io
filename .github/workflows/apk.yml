name: Compilar APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Llave de firma
        env: { KEYSTORE_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Compilar
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk Home.apk
      - uses: actions/upload-artifact@v4
        with: { name: Home-apk, path: Home.apk }
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Home para Android
          body: Descarga Home.apk desde el celular e instálala.
          files: Home.apk
          make_latest: true
