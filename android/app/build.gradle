plugins { id 'com.android.application' }

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.jgvillota.home'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jgvillota.home'
        minSdk 23
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'release.jks')
            storePassword((System.getenv('KEYSTORE_PASSWORD') ?: '').trim())
            keyAlias 'home'
            keyPassword((System.getenv('KEYSTORE_PASSWORD') ?: '').trim())
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
